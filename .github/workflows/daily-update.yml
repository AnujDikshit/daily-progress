name: Daily Progress

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily log
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p daily

          echo "# Daily Progress - $DATE" > "daily/$DATE.md"
          echo "" >> "daily/$DATE.md"
          echo "Daily development progress." >> "daily/$DATE.md"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: daily progress" || exit 0
          git push
